name: ReelGuard Android

on:
  push:
    paths:
      - "reelguard/**"
      - ".github/workflows/reelguard-android.yml"
  pull_request:
    paths:
      - "reelguard/**"
      - ".github/workflows/reelguard-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reelguard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit + Robolectric tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Lint
        run: ./gradlew lintDebug --console=plain

      - name: Build APKs (debug, release-unsigned, instrumented tests)
        run: ./gradlew assembleDebug assembleRelease assembleDebugAndroidTest --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: reelguard-debug-apk
          path: reelguard/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reelguard-reports
          path: |
            reelguard/app/build/reports/
            reelguard/app/build/test-results/
